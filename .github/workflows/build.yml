name: Build and Release

on:
  push:
    tags: [ 'v*' ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform.name }})
    strategy:
      fail-fast: false
      matrix:
        platform:
          # - name: macOS-ARM
          #   os: macos-latest
          #   rust-target: aarch64-apple-darwin
          #   tauri-args: --target aarch64-apple-darwin
          # - name: macOS-Intel
          #   os: macos-latest
          #   rust-target: x86_64-apple-darwin
          #   tauri-args: --target x86_64-apple-darwin
          # - name: Linux
          #   os: ubuntu-22.04
          #   rust-target: x86_64-unknown-linux-gnu
          #   tauri-args: ''
          - name: Windows
            os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            tauri-args: ''

    runs-on: ${{ matrix.platform.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux dependencies
        if: matrix.platform.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.rust-target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.platform.os }}-${{ matrix.platform.rust-target }}-rust-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun
            node_modules
          key: ${{ matrix.platform.os }}-bun-${{ hashFiles('bun.lock', 'package-lock.json', 'package.json') }}
          restore-keys: |
            ${{ matrix.platform.os }}-bun-

      - name: Install frontend dependencies
        run: bun install

      - name: Build frontend
        run: bun run build

      - name: Build Tauri application
        run: bun run tauri build ${{ matrix.platform.tauri-args }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Create Windows Portable version
        if: matrix.platform.name == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $exePath = "src-tauri/target/release/fangyu-code.exe"
          $portableName = "Fangyu_Code_${version}_x64-portable.exe"
          $portablePath = "src-tauri/target/release/bundle/$portableName"
          New-Item -ItemType Directory -Force -Path "src-tauri/target/release/bundle"
          Copy-Item $exePath $portablePath
          Write-Host "Created portable version: $portableName"

      - name: Upload build artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform.name }}
          path: |
            src-tauri/target/*/release/bundle/**/*
            src-tauri/target/release/bundle/**/*
          retention-days: 3

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.platform.name }}
          path: |
            src-tauri/target/*/release/build/*/output
            src-tauri/target/release/build/*/output
          retention-days: 3

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: build-*
          merge-multiple: true

      - name: Rename Windows updater files
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          # Find and rename Windows NSIS updater files
          WIN_NSIS=$(find artifacts -name "*-setup.exe" ! -name "*.sig" -type f | head -n 1)
          WIN_NSIS_SIG=$(find artifacts -name "*-setup.exe.sig" -type f | head -n 1)
          if [ -n "$WIN_NSIS" ]; then
            WIN_DIR=$(dirname "$WIN_NSIS")
            mv "$WIN_NSIS" "$WIN_DIR/Fangyu_Code_${VERSION}_x64-setup.exe"
            echo "Renamed: $WIN_NSIS -> Fangyu_Code_${VERSION}_x64-setup.exe"
          fi
          if [ -n "$WIN_NSIS_SIG" ]; then
            WIN_DIR=$(dirname "$WIN_NSIS_SIG")
            mv "$WIN_NSIS_SIG" "$WIN_DIR/Fangyu_Code_${VERSION}_x64-setup.exe.sig"
            echo "Renamed: $WIN_NSIS_SIG -> Fangyu_Code_${VERSION}_x64-setup.exe.sig"
          fi

          echo "Windows updater files renamed"
          find artifacts -name "*.sig" -type f

      - name: Generate latest.json for updater
        run: |
          # Extract version from tag (remove 'v' prefix)
          VERSION="${GITHUB_REF_NAME#v}"

          # Get current date in RFC 3339 format
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Find Windows NSIS signature file
          WINDOWS_NSIS_SIG=$(find artifacts -name "*-setup.exe.sig" -type f | head -n 1)

          # Check if Windows signature exists
          if [ -z "$WINDOWS_NSIS_SIG" ]; then
            echo "::error::Missing signature file for windows-x86_64 (*-setup.exe.sig)"
            echo "Updater signature is required. Ensure bundle.createUpdaterArtifacts=true and TAURI_SIGNING_PRIVATE_KEY is set during build."
            exit 1
          fi

          # Read Windows signature
          WINDOWS_NSIS_SIGNATURE=$(cat "$WINDOWS_NSIS_SIG")

          # Check if signature content is empty
          if [ -z "$WINDOWS_NSIS_SIGNATURE" ]; then
            echo "::error::Empty signature content for windows-x86_64"
            exit 1
          fi

          # Generate latest.json (Windows only)
          cat > latest.json << EOF
          {
            "version": "$VERSION",
            "pub_date": "$PUB_DATE",
            "notes": "See the full changelog at https://github.com/${{ github.repository }}/releases/tag/$GITHUB_REF_NAME",
            "platforms": {
              "windows-x86_64": {
                "signature": "$WINDOWS_NSIS_SIGNATURE",
                "url": "https://github.com/${{ github.repository }}/releases/download/$GITHUB_REF_NAME/Fangyu_Code_${VERSION}_x64-setup.exe"
              }
            }
          }
          EOF

          echo "Generated latest.json:"
          cat latest.json

      - name: Check if release exists
        id: check_release
        run: |
          if gh release view ${{ github.ref_name }} > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload assets to existing release
        if: steps.check_release.outputs.exists == 'true'
        run: |
          # Upload Windows artifacts to existing release
          find artifacts -type f \( -name "*-setup.exe" -o -name "*-setup.exe.sig" \
            -o -name "*-portable.exe" \) -exec gh release upload ${{ github.ref_name }} {} --clobber \;
          gh release upload ${{ github.ref_name }} latest.json --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        if: steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          name: Fangyu Code ${{ github.ref_name }}
          body: |
            ## Fangyu Code ${{ github.ref_name }}

            ### 下载 Downloads

            - **Windows (安装版)**: `*-setup.exe` - **支持自动更新**
            - **Windows (免安装版)**: `*-portable.exe` - 需手动更新

            ### 自动更新 Auto-Update
            安装版本支持自动更新，应用会自动检查并提示更新。

            ### 更新日志 Changelog
            详见: https://github.com/${{ github.repository }}/commits/${{ github.ref_name }}
          files: |
            artifacts/**/*-setup.exe
            artifacts/**/*-setup.exe.sig
            artifacts/**/*-portable.exe
            latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
