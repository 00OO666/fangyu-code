name: 'Release'

on:
  push:
    tags:
      - 'v*.*.*' # 匹配版本标签，如 v1.2.10

# 权限配置
permissions:
  contents: write # 允许创建 Releases

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: '--target x86_64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: ${{ github.ref_name }} # 使用 git tag 作为 release 标签
          releaseName: 'Fangyu Code ${{ github.ref_name }}'
          releaseBody: |
            ## 🎉 Fangyu Code ${{ github.ref_name }}

            ### 安装方式

            1. **首次安装**：下载 `.nsis.exe` 安装包并运行
            2. **自动更新**：已安装用户会自动收到更新提示

            ### 更新内容

            详见 [CHANGELOG.md](https://github.com/00OO666/fangyu-code/blob/main/CHANGELOG.md)

            ---

            **下载说明**：
            - `Fangyu-Code_*_x64-setup.nsis.exe` - 完整安装包
            - `*.nsis.zip` / `*.nsis.zip.sig` - 自动更新包（无需手动下载）
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
