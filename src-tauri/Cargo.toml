[package]
name = "fangyu-code"
version = "2.2.0"
description = "Fangyu Code - Fangyu 专属 AI 开发工具"
authors = ["Fangyu"]
license = "AGPL-3.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html


[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.9", features = ["protocol-asset", "tray-icon", "image-png", "devtools"] }
tauri-plugin-shell = "2.3"
tauri-plugin-dialog = "2.4"
tauri-plugin-fs = "2"
tauri-plugin-process = "2.3"
tauri-plugin-updater = "2.9"
tauri-plugin-notification = "2.3"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2.3"
tauri-plugin-window-state = "2"
tauri-plugin-http = "2"
image = "0.25"
arboard = "3.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
regex = "1"
toml = "0.8"
toml_edit = "0.22"
lazy_static = "1.4"
md5 = "0.7"
glob = "0.3"
base64 = "0.22"
reqwest = { version = "0.12", features = ["json"] }
futures = "0.3"
async-trait = "0.1"
tempfile = "3"
sha2 = "0.10"
zstd = "0.13"
uuid = { version = "1.6", features = ["v4", "serde"] }
walkdir = "2"
serde_yaml = "0.9"
once_cell = "1.19"
urlencoding = "2.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Graphics_Dwm",
] }

# Fast build profile for development/testing
[profile.dev-release]
inherits = "release"
opt-level = 2       # Good performance, much faster than "z"
lto = "thin"        # Thin LTO - faster than full LTO
codegen-units = 16  # Enable parallel compilation
incremental = true  # Enable incremental compilation
debug = true        # Keep debug info for better debugging

# Production release profile - 优化编译速度 + 体积平衡
[profile.release]
opt-level = 2           # 改用 opt-level 2（比 "z" 快很多，体积略大但可接受）
lto = "thin"            # 使用 thin LTO（比 full LTO 快 3-5 倍）
codegen-units = 8       # 增加并行编译单元（加速编译）
panic = "abort"         # Abort on panic
strip = true            # Strip symbols
overflow-checks = false # Disable overflow checks
debug = false           # Disable debug info
incremental = true      # ✅ 启用增量编译（最关键！后续编译快 5-10 倍）

# Additional size optimizations
[profile.release.package."*"]
opt-level = "z"     # Optimize all dependencies for size

[features]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
